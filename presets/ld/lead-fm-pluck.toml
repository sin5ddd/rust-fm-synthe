name = "lead-fm-pluck"
description = "C3（MIDI 48、約130.8 Hz）の短いFMプラック。C4ではない。速いアンプとフィルタADSR。メロディ用。"
algorithm = 5
feedback = 0.1
feedback_op = 4
gain = 1.0
default_note = 48
default_duration = 8.2

[filter]
type = "lowpass"
cutoff = 320.0
resonance = 0.34
env_amount = 4.6
attack = 0.0008
decay = 0.14
sustain = 0.22
release = 0.2

# ごく薄いオクターブ上。C3がC4に負けないように mix は低め。
[fx.chorus]
mix = 0.12
rate_hz = 0.85
depth_ms = 2.8
delay_ms = 11.0
feedback = 0.06
intervals = ["octave-up"]

# OP1 キャリア: 比 1 = C3 基音（約130.8 Hz）。オクターブ上にしない。

[[operators]]
ratio = 1.0
detune_cents = 0.0
level = 1.0
attack = 0.0009
decay = 0.22
sustain = 0.75
release = 0.2
vel_sens = 0.4
waveform = "sine"

# OP2 弱い 2:1。上げすぎると C4 が基音に聞こえる。
[[operators]]
ratio = 2.0
detune_cents = 3.0
level = 0.28
attack = 0.0004
decay = 0.05
sustain = 0
release = 0.025
vel_sens = 0.5
waveform = "sine"

# OP3 静かなオクターブ。C3基音より小さく。
[[operators]]
ratio = 2.0
detune_cents = -4.0
level = 0.30
attack = 0.0012
decay = 0.18
sustain = 0.75
release = 0.16
vel_sens = 0.32
waveform = "sine"

# OP4 短いキラッと
[[operators]]
ratio = 4.0
detune_cents = 0.0
level = 0.08
attack = 0.0002
decay = 0.016
sustain = 0
release = 0.01
vel_sens = 0.6
waveform = "sine"
