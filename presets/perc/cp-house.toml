name = "cp-house"
description = "短いドライなハウスクラップ。2/4専用。1 kHz付近の短い胴＋ハイのスラップ。スネア代用でもサブでもない。"
algorithm = 6
feedback = 0.88
feedback_op = 4
gain = 1.16
default_note = 60
default_duration = 0.28

# Same family as pc-clap-dry (user-ok), but a longer 1 kHz body.
# Lower FM index than the previous house take — high index on 1 kHz pulse
# reads as metal, not palm.
[filter]
type = "highpass"
cutoff = 840.0
resonance = 0.14
env_amount = 0.22
attack = 0.0002
decay = 0.1
sustain = 0.08
release = 0.05

# Flesh of the パン. Sine so the long body is not a buzzy pulse cluster.
[[operators]]
ratio = 1.0
detune_cents = 0.0
level = 1.0
attack = 0.0002
decay = 0.4
sustain = 0.0
release = 0.08
vel_sens = 0.5
waveform = "sine"
freq_mode = "fixed"
fixed_hz = 1080.0

# Slap grain ~9 ms
[[operators]]
ratio = 1.0
detune_cents = 12.0
level = 0.82
attack = 0.009
decay = 0.12
sustain = 0.0
release = 0.045
vel_sens = 0.55
waveform = "pulse"
freq_mode = "fixed"
fixed_hz = 1380.0

# Air grain ~18 ms
[[operators]]
ratio = 1.0
detune_cents = -10.0
level = 0.58
attack = 0.018
decay = 0.1
sustain = 0.0
release = 0.04
vel_sens = 0.52
waveform = "pulse"
freq_mode = "fixed"
fixed_hz = 1720.0

# Modulator: enough smear for a band, not a bell. Lasts past the carriers.
[[operators]]
ratio = 1.0
detune_cents = 0.0
level = 1.08
attack = 0.00012
decay = 0.5
sustain = 0.0
release = 0.09
vel_sens = 0.6
waveform = "pulse"
freq_mode = "fixed"
fixed_hz = 168.0
