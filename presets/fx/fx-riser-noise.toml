name = "fx-riser-noise"
description = "ノイズライザー。サブとスタート約100Hzのサインを重ね、砂が濃くなりピッチも上がる。130 BPMの8小節を覆う長さ。"
algorithm = 7
feedback = 0.32
feedback_op = 4
gain = 0.98
default_note = 55
# 8 bars at 130 BPM, 4/4 ≈ 14.769 s, plus a short release tail.
default_duration = 15.0

