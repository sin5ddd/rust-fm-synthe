name = "fx-uplifter"
description = "アップリフター。サブとスタート約100Hzのサインを重ね、ピッチ上昇＋フィルタ開放。130 BPMの8小節を覆う長さ。"
algorithm = 7
feedback = 0.34
feedback_op = 4
gain = 0.95
default_note = 60
# 8 bars at 130 BPM, 4/4 ≈ 14.769 s, plus a short release tail.
default_duration = 15.0

