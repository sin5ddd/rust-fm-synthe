name = "fx-uplifter"
description = "アップリフター。薄いサブとスタート約100Hzのサインの上で、ピッチ上昇とフィルタ開放が同時に起きる。130 BPMの8小節を覆う長さ。"
algorithm = 7
feedback = 0.3
feedback_op = 4
gain = 0.95
default_note = 60
# 8 bars at 130 BPM, 4/4 ≈ 14.769 s, plus a short release tail.
default_duration = 15.0

[pitch]
start_semitones = -16.0
end_semitones = 28.0
curve = 0.5

[lfo]
rate_hz = 0.38
depth_cents = 14.0

[mod_sweep]
start = 0.3
end = 1.4

[filter]
type = "lowpass"
cutoff = 700.0
resonance = 0.22
env_amount = 3.8
attack = 11.0
decay = 1.2
sustain = 0.85
release = 0.25

