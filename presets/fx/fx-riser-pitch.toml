name = "fx-riser-pitch"
description = "ピッチ主体のライザー。薄いサブとスタート約100Hzのサインの上で、ソーの芯が15秒かけてはっきり上がる。130 BPMの8小節を覆う長さ。"
algorithm = 8
feedback = 0.38
feedback_op = 4
gain = 1.0
default_note = 60
# 8 bars at 130 BPM, 4/4 ≈ 14.769 s, plus a short release tail.
default_duration = 15.0

[pitch]
start_semitones = -22.0
end_semitones = 26.0
# Milder curve so the climb is visible across the body, not only in the last bar.
curve = 0.55

[mod_sweep]
start = 0.45
end = 1.25

[filter]
type = "lowpass"
cutoff = 1100.0
resonance = 0.16
env_amount = 3.0
attack = 10.5
decay = 1.2
sustain = 0.85
release = 0.25

# OP1 サブ。ratio 0.25。ベッドだけ。追跡を奪わないよう小さく。
[[operators]]
ratio = 0.25
detune_cents = 0
level = 0.22
attack = 0.6
decay = 8.0
sustain = 0.75
release = 0.3
vel_sens = 0.18
waveform = "sine"

# OP2 素のサイン。MIDI 60・pitch start -22 st で約 100 Hz。包絡に追従して上昇。
[[operators]]
ratio = 1.3621
detune_cents = 0
level = 0.52
attack = 0.25
decay = 8.0
sustain = 0.8
release = 0.3
vel_sens = 0.2
waveform = "sine"

# OP3 ソー本体。ピッチの芯。フィルタが開くにつれて主役。
