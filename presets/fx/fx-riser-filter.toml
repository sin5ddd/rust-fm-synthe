name = "fx-riser-filter"
description = "フィルタ開放のライザー。サブとスタート約100Hzのサインを重ね、カットオフが主役。130 BPMの8小節を覆う長さ。"
algorithm = 7
feedback = 0.36
feedback_op = 4
gain = 0.96
default_note = 60
# 8 bars at 130 BPM, 4/4 ≈ 14.769 s, plus a short release tail.
default_duration = 15.0

[pitch]
start_semitones = -4.0
end_semitones = 8.0
curve = 1.0

[lfo]
rate_hz = 0.5
depth_cents = 16.0

[mod_sweep]
start = 0.3
end = 1.45

[filter]
type = "lowpass"
cutoff = 160.0
resonance = 0.32
env_amount = 6.0
attack = 11.0
decay = 1.4
sustain = 0.75
release = 0.25

[noise]
type = "white"
level = 0.78
attack = 0.5
decay = 8.0
sustain = 0.7
release = 0.3
vel_sens = 0.2

[noise.filter]
type = "lowpass"
cutoff = 180.0
resonance = 0.2
env_amount = 5.4
attack = 11.0
decay = 1.4
sustain = 0.7
release = 0.25

# OP1 サブ。ratio 0.25。
