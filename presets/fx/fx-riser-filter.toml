name = "fx-riser-filter"
description = "フィルタ開放のライザー。薄いサブとスタート約100Hzのサインの上で、共振ローパスの尾根が上へ開く。130 BPMの8小節を覆う長さ。"
algorithm = 7
feedback = 0.3
feedback_op = 4
gain = 0.96
default_note = 60
# 8 bars at 130 BPM, 4/4 ≈ 14.769 s, plus a short release tail.
default_duration = 15.0

