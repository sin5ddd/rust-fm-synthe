name = "fx-riser-saw"
description = "スーパーソーのライザー。薄いサブとスタート約100Hzのサインの上で、デチューンしたソーがピッチ包絡と一緒に上昇。130 BPMの8小節を覆う長さ。"
algorithm = 8
feedback = 0.16
feedback_op = 4
gain = 0.94
default_note = 48
# 8 bars at 130 BPM, 4/4 ≈ 14.769 s, plus a short release tail.
default_duration = 15.0

[pitch]
start_semitones = -14.0
end_semitones = 22.0
curve = 0.5

[lfo]
rate_hz = 0.22
depth_cents = 10.0

[mod_sweep]
start = 0.45
end = 1.15

[filter]
# Static HP so the 2-octave-down sub cannot become the tracked pitch.
type = "highpass"
cutoff = 80.0
resonance = 0.06
env_amount = 0.0
attack = 0.01
decay = 0.01
sustain = 1.0
release = 0.25

# OP1 サブ。ratio 0.25。ベッドだけ。
[[operators]]
ratio = 0.25
detune_cents = 0
level = 0.08
attack = 0.6
decay = 8.0
sustain = 0.75
release = 0.3
vel_sens = 0.16
waveform = "sine"

