name = "wobble bass"
description = "ベース用ウォブルワンショット。速めのピッチLFOとBPエンベ。リードの ld-wobble より低く、サブ〜ミッド。"
algorithm = 7
feedback = 0.34
feedback_op = 4
gain = 1.0
default_note = 36
default_duration = 1.9

[lfo]
rate_hz = 6.2
depth_cents = 36

[mod_sweep]
start = 1.15
end = 0.55

# BP を ~120 Hz に置き、エンベで低ミッドまで動かす。細いミッドのビープにしない。
[filter]
type = "bandpass"
cutoff = 128
resonance = 0.3
env_amount = 1.55
attack = 0.01
decay = 0.2
sustain = 0.22
release = 0.14

# OP1 加算の ~120 Hz 胴（C2 × 1.835）
[[operators]]
ratio = 1.835
detune_cents = -2
level = 0.82
attack = 0.01
decay = 1.35
sustain = 0.38
release = 0.24
vel_sens = 0.26
waveform = "sine"

# OP2 ノートのソー。サブ基音と倍音。LFOでウォブル
[[operators]]
ratio = 1
detune_cents = 5
level = 0.7
attack = 0.008
decay = 1.15
sustain = 0.28
release = 0.2
vel_sens = 0.32
waveform = "saw"

# OP3 ウォブルの喉（4→3）
[[operators]]
ratio = 1.5
detune_cents = -8
level = 0.4
attack = 0.005
decay = 0.32
sustain = 0.1
release = 0.1
vel_sens = 0.45
waveform = "half-sine"

# OP4 フィードバック源
[[operators]]
ratio = 2
