name = "tight house bass"
description = "タイトなハウスベース。短い減衰でサイドチェイン向き。サブの芯＋短いミッドクリック。長いReeseや808ではない。"
algorithm = 7
feedback = 0.12
feedback_op = 4
gain = 1.08
default_note = 36
default_duration = 0.85

[pitch]
start_semitones = 3.5
end_semitones = 0
curve = 2

# アタックだけ LP を開いて 1–3 kHz のクリックを通し、すぐ閉じる。
[filter]
type = "lowpass"
cutoff = 480
resonance = 0.18
env_amount = 2.4
attack = 0.0004
decay = 0.055
sustain = 0.06
release = 0.07

# サブの芯（C2 指定でも ratio 0.5 で床を足す）
[[operators]]
ratio = 0.5
detune_cents = 0
level = 1
attack = 0.002
decay = 0.38
sustain = 0
release = 0.1
vel_sens = 0.25
waveform = "sine"

[[operators]]
ratio = 1
detune_cents = 3
level = 0.38
attack = 0.0015
decay = 0.12
sustain = 0
release = 0.05
vel_sens = 0.35
waveform = "sine"

# ミッドクリック（alg 7 で OP4→OP3）
[[operators]]
ratio = 1
detune_cents = 0
level = 0.85
attack = 0.00025
decay = 0.022
sustain = 0
release = 0.012
vel_sens = 0.52
waveform = "pulse"
freq_mode = "fixed"
fixed_hz = 1650

[[operators]]
ratio = 1
detune_cents = 0
level = 0.62
attack = 0.0002
decay = 0.012
sustain = 0
release = 0.008
vel_sens = 0.55
waveform = "pulse"
freq_mode = "fixed"
fixed_hz = 2680
