name = "cp-house"
description = "短いドライなハウスクラップ。2/4専用。1 kHz付近の短い胴＋ハイのスラップ。スネア代用でもサブでもない。"
algorithm = 5
feedback = 0.78
feedback_op = 4
gain = 1.16
default_note = 60
default_duration = 0.28

# HP を 1 kHz 手前に置き、レゾナンスで胴を出す。サブとスネア帯（〜400 Hz）は切る。
[filter]
type = "highpass"
cutoff = 820.0
resonance = 0.38
env_amount = 0.45
attack = 0.0002
decay = 0.055
sustain = 0.06
release = 0.05

# 1層目: 1 kHz 付近の短い胴（ハットに負けないミッド）
